# Deviation from plan: bumped leptos 0.6 -> 0.8 and worker 0.3 -> 0.8 (latest as of 2026-05).
# Leptos 0.8 SSR API: render via `Owner::new().with(|| App().to_html())`
# (no more `leptos::ssr::render_to_string`). `RenderHtml` trait comes from `leptos::tachys::view`.
# worker-build runs from `crates/worker/`, so `main` lives under that directory.
# Renamed local crate to `realmdex-worker` to avoid collision with crates.io `worker`.
# Prepend ~/.cargo/bin to PATH so rustup's toolchain wins over a homebrew rust that may
# shadow it; the wasm32-unknown-unknown target needs the rustup-managed sysroot.

name = "realmdex"
main = "crates/worker/build/worker/shim.mjs"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

[vars]
CF_ACCESS_TEAM_DOMAIN = "valor"

[build]
command = "bash scripts/build-worker.sh"

[triggers]
crons = [
  "*/1 * * * *",   # poller every minute
  "30 3 * * *",    # rollup daily at 03:30 UTC (placeholder, implemented in Task 15)
]

[assets]
directory = "public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "realmdex"
# Placeholder: replace with the real id from `wrangler d1 create realmdex` before first real deploy.
database_id = "9b8a7bbe-dfbe-4bc7-bb49-5612b080e456"
migrations_dir = "migrations"

[env.production]
name = "realmdex"

[[env.production.d1_databases]]
binding = "DB"
database_name = "realmdex-prod"
# Placeholder: replace with the real id from `wrangler d1 create realmdex-prod` before first real deploy.
database_id = "f1f24031-884c-4e5e-b513-9592022b91ce"
migrations_dir = "migrations"
